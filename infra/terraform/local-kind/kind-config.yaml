# Local stand-in for EKS while developing:  kind create cluster --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: infradian
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080 }  # inventory-api
      - { containerPort: 30030, hostPort: 3001 }  # grafana
      - { containerPort: 30090, hostPort: 9090 }  # prometheus
      - { containerPort: 30443, hostPort: 8443 }  # argocd
  - role: worker
  - role: worker
