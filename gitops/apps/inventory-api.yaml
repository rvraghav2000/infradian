apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inventory-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rvraghav2000/infradian.git
    targetRevision: main
    path: deploy/helm/inventory-api
    helm:
      valueFiles:
        - ../../../gitops/values/inventory-api.yaml
  destination: { server: https://kubernetes.default.svc, namespace: inventory }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
