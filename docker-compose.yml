services:
  neo4j:
    image: neo4j:latest
    container_name: infradian-neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/admin123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data # Persistent volume for graph data

  backend:
    build: ./backend
    container_name: infradian-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=admin123
    volumes:
      - ./backend:/app # Sync backend code for hot-reloading
      - ./sample_payload.json:/sample_payload.json:ro # fallback data if Neo4j is down
    depends_on:
      - neo4j

  frontend:
    build: ./frontend
    container_name: infradian-frontend
    ports:
      - "3000:3000" # Mapped to development port 3000
    volumes:
      - ./frontend:/app # Sync frontend code for hot-reloading
      - /app/node_modules
    environment:
      - API_TARGET=http://backend:8000   # vite proxy inside the container network
    depends_on:
      - backend

  inventory-db:
    image: postgres:16-alpine
    profiles: [platform]
    environment: { POSTGRES_USER: inventory, POSTGRES_PASSWORD: change-me, POSTGRES_DB: inventory }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U inventory"], interval: 5s, retries: 10 }

  inventory-api:
    build: ./services/inventory-api
    profiles: [platform]
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://inventory:change-me@inventory-db:5432/inventory?sslmode=disable
    depends_on:
      inventory-db: { condition: service_healthy }

volumes:
  neo4j_data: # Named volume for database persistence
