version: '3.8'

services:
  neo4j:
    image: neo4j:5
    container_name: infradian-neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/admin123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "admin123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
